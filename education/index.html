<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Supports, méthodes et ressources pour apprendre."><title>Éducation — Mes mini-sites</title>
<style>
:root{--ink:#172033;--muted:#65708a;--accent:#4f46e5}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at top,#e8e7ff,transparent 30rem),#f5f7fb}
main{width:min(600px,100%);padding:clamp(2rem,7vw,4rem);text-align:center;background:#ffffffe8;border:1px solid #e5e9f2;border-radius:24px;box-shadow:0 18px 50px #1f293714}
.icon{font-size:3rem}h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.04em;margin:.7rem 0}.status{display:inline-block;padding:.4rem .75rem;border-radius:999px;background:#eeedff;color:var(--accent);font-size:.8rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em}
p{color:var(--muted);line-height:1.65;margin:1rem auto 1.8rem}a{display:inline-block;color:#fff;background:var(--accent);padding:.8rem 1.1rem;border-radius:12px;text-decoration:none;font-weight:700}a:hover,a:focus-visible{background:#3730a3;outline:3px solid #c7c3ff;outline-offset:3px}
</style></head>
<body><main><div class="icon" aria-hidden="true">🎓</div><span class="status">Bientôt disponible</span><h1>Éducation</h1><p>Supports, méthodes et ressources pour apprendre. Cette rubrique est prête à accueillir son premier mini-site.</p><a href="../">← Retour à l’accueil</a></main></body>
